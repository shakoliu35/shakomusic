<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini RooMi V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#18202b;color:#fff;overflow:hidden}
#top{height:58px;background:#222c39;display:flex;align-items:center;gap:12px;padding:0 16px}
#top b{font-size:20px}.pill{background:#344355;padding:7px 11px;border-radius:18px;font-size:13px}
#world{position:relative;height:calc(100vh - 58px);overflow:hidden;background:#b7dfaa}
#map{position:absolute;inset:0;background:linear-gradient(90deg,#fff2 1px,transparent 1px) 0 0/80px 80px,linear-gradient(#fff2 1px,transparent 1px) 0 0/80px 80px,#b7dfaa}
.path{position:absolute;background:#e8d8a8;border:5px solid #d3c08c;border-radius:40px}.p1{width:80%;height:100px;left:10%;top:43%}.p2{height:75%;width:95px;left:46%;top:12%}
.house,.shop{position:absolute;width:150px;height:110px;border-radius:12px;box-shadow:0 7px 0 #0004}
.house{left:7%;top:12%;background:#f3c8a2;border:5px solid #9e6f50}.shop{right:7%;top:18%;background:#f4df9d;border:5px solid #9b7a3e}
.label{padding:30px 15px;font-weight:bold;color:#704c25}
.player{position:absolute;width:55px;height:68px;transform:translate(-50%,-70%);transition:left .08s,top .08s;cursor:pointer}
.avatar{width:36px;height:36px;border-radius:50%;margin:auto;border:3px solid #fff;background:#ffd2a8;position:relative}.avatar:after{content:"";position:absolute;width:44px;height:10px;left:-7px;top:25px;background:#4d78c9;border-radius:10px}
.name{text-align:center;background:#0009;border-radius:9px;padding:2px 5px;font-size:11px;white-space:nowrap}
#chat{position:absolute;right:16px;bottom:16px;width:330px;background:#19212bd9;border:1px solid #47576a;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px #0004}
#messages{height:210px;overflow:auto;padding:12px;font-size:13px}.msg{margin:7px 0}.msg b{color:#ffd66b}
#send{display:flex;border-top:1px solid #465364}#input{flex:1;background:#151c25;border:0;color:#fff;padding:12px;outline:0}#btn{border:0;background:#4c83e8;color:#fff;padding:0 15px}
#hint{position:absolute;left:16px;bottom:16px;background:#19212bd9;padding:9px 12px;border-radius:10px;font-size:12px}
#modal{position:absolute;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:5}
.box{background:#222c39;padding:25px;border-radius:16px;width:min(360px,90%);text-align:center}.box input{width:100%;padding:12px;border-radius:8px;border:0;margin:12px 0;background:#101720;color:white}.box button{padding:11px 22px;border:0;border-radius:8px;background:#4c83e8;color:#fff}
#toast{position:absolute;top:15px;left:50%;transform:translateX(-50%);background:#202a37ee;padding:10px 16px;border-radius:20px;display:none;z-index:4}
</style>
</head>
<body>
<div id="top"><b>🌴 Mini RooMi V2</b><span class="pill" id="count">在线：0/2</span><span class="pill">双人房</span></div>
<div id="world"><div id="map"><div class="path p1"></div><div class="path p2"></div><div class="house"><div class="label">🏠 小屋</div></div><div class="shop"><div class="label">🛍️ 商店</div></div></div>
<div id="toast"></div><div id="hint">WASD / 方向键移动　·　两个人打开同一个网址即可见面</div>
<div id="chat"><div id="messages"></div><div id="send"><input id="input" placeholder="说点什么…"><button id="btn">发送</button></div></div></div>
<div id="modal"><div class="box"><h2>🌴 Mini RooMi</h2><p>给自己取一个昵称</p><input id="nick" maxlength="12" placeholder="例如：小明"><button id="join">进入世界</button></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();let myId=null,me={x:50,y:55},speed=1.2;
const modal=document.getElementById('modal'),nick=document.getElementById('nick'),world=document.getElementById('world');
function msg(name,text){const d=document.createElement('div');d.className='msg';d.innerHTML='<b>'+esc(name)+'：</b>'+esc(text);messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const messages=document.getElementById('messages');
document.getElementById('join').onclick=()=>{const n=nick.value.trim()||'玩家';socket.emit('setName',n);modal.style.display='none';msg('系统','欢迎 '+n+'！');};
nick.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('join').click()});
document.getElementById('btn').onclick=send;document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
function send(){const i=document.getElementById('input');if(i.value.trim()){socket.emit('chat',i.value);i.value=''}}
socket.on('init',d=>{myId=d.you.id;me=d.you});
socket.on('full',()=>{modal.querySelector('p').textContent='房间已满，目前最多 2 人。';document.getElementById('join').disabled=true});
socket.on('chat',d=>msg(d.name,d.text));
socket.on('players',ps=>{document.getElementById('count').textContent='在线：'+ps.length+'/2';document.querySelectorAll('.player').forEach(e=>e.remove());
ps.forEach((p,i)=>{const el=document.createElement('div');el.className='player';el.style.left=p.x+'%';el.style.top=p.y+'%';el.innerHTML='<div class="avatar" style="background:'+(p.id===myId?'#ffd2a8':'#f4b6d2')+'"></div><div class="name">'+esc(p.name)+(p.id===myId?'（你）':'')+'</div>';world.appendChild(el);});});
document.addEventListener('keydown',e=>{if(document.activeElement===document.getElementById('input')||document.activeElement===nick)return;let dx=0,dy=0;if(['ArrowUp','w','W'].includes(e.key))dy=-speed;if(['ArrowDown','s','S'].includes(e.key))dy=speed;if(['ArrowLeft','a','A'].includes(e.key))dx=-speed;if(['ArrowRight','d','D'].includes(e.key))dx=speed;if(dx||dy){e.preventDefault();me.x=Math.max(5,Math.min(95,me.x+dx));me.y=Math.max(8,Math.min(92,me.y+dy));socket.emit('move',{x:me.x,y:me.y})}});
</script>
</body></html>
