<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini RooMi V2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            overflow: hidden;
            height: 100vh;
        }
        /* 顶部导航栏 */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background-color: rgba(0,0,0,0.55);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap:12px;
            z-index:10;
        }
        .title {
            font-size:18px;
            font-weight:bold;
        }
        .online-tag {
            background:#288b44;
            padding:4px 10px;
            border-radius:12px;
            font-size:13px;
        }
        .room-tag {
            background:#205799;
            padding:4px 10px;
            border-radius:12px;
            font-size:13px;
        }
        /* 主背景画布 */
        .bg-container {
            width:100vw;
            height:100vh;
            background-image: url('https://i.imgur.com/6sNQ2VY.png');
            background-size: cover;
            background-position: center;
            position:relative;
        }
        /* 中间大标题 */
        .main-title{
            position:absolute;
            top:10%;
            left:50%;
            transform:translateX(-50%);
            text-align:center;
        }
        .welcome-text{
            font-size:32px;
            color:white;
            text-shadow: 2px 2px 4px #000;
        }
        .space-text{
            font-size:72px;
            font-weight:bold;
            background: linear-gradient(180deg,#ffd02b,#40b8ff);
            -webkit-background-clip:text;
            color:transparent;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }
        /* 右下角聊天面板 */
        .chat-panel{
            position:absolute;
            bottom:40px;
            right:30px;
            width:280px;
            background:rgba(0,0,0,0.65);
            border-radius:8px;
            overflow:hidden;
            color:#fff;
        }
        .chat-content{
            min-height:120px;
            padding:10px;
            font-size:14px;
        }
        .system-msg{
            color:#ffdd44;
        }
        .chat-input-area{
            display:flex;
        }
        .chat-input{
            flex:1;
            padding:8px 10px;
            border:none;
            outline:none;
            background:rgba(255,255,255,0.2);
            color:#fff;
        }
        .chat-input::placeholder{
            color:#cccccc;
        }
        .send-btn{
            background:#3478f6;
            color:white;
            border:none;
            padding:0 14px;
            cursor:pointer;
        }
        /* 底部提示文字 */
        .bottom-hint{
            position:absolute;
            bottom:10px;
            left:10px;
            color:#fff;
            font-size:13px;
            background:rgba(0,0,0,0.45);
            padding:4px 8px;
            border-radius:4px;
        }
    </style>
</head>
<body>
    <!--顶部栏-->
    <div class="top-bar">
        <div class="title">Mini RooMi V2</div>
        <div class="online-tag">在线：1/10</div>
        <div class="room-tag">十人房</div>
    </div>

    <!--背景主体-->
    <div class="bg-container">
        <!--大标题-->
        <div class="main-title">
            <div class="welcome-text">欢迎来到<br></div>
            <div class="space-text">shako的平行空间</div>
        </div>

        <!--聊天框-->
        <div class="chat-panel">
            <div class="chat-content">
                <div class="system-msg">系统：欢迎 shako!</div>
            </div>
            <div class="chat-input-area">
                <input class="chat-input" placeholder="说点什么…">
                <button class="send-btn">发送</button>
            </div>
        </div>

        <!--底部操作提示-->
        <div class="bottom-hint">
            WASD /方向键移动 · 最多十个人打开同一个网址即可见面
        </div>
    </div>

    <script>
        //简单聊天发送示例
        const input = document.querySelector('.chat-input');
        const sendBtn = document.querySelector('.send-btn');
        const chatBox = document.querySelector('.chat-content');

        function sendChat(){
            const val = input.value.trim();
            if(!val) return;
            const div = document.createElement('div');
            div.innerText = val;
            chatBox.appendChild(div);
            input.value = '';
        }
        sendBtn.onclick = sendChat;
        input.onkeydown = (e)=>{
            if(e.key === 'Enter') sendChat();
        }
    </script>
</body>
</html>
