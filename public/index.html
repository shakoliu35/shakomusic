<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shako的平行空间</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Microsoft YaHei",sans-serif;
  background:#000;
  color:#fff
}

#world{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden
}

#map{
  position:absolute;
  inset:0;
  background:url('./beach-bg.png') center center/cover no-repeat
}

#top{
  position:absolute;
  left:18px;
  top:18px;
  display:flex;
  align-items:center;
  gap:10px;
  z-index:30
}

#top b{
  font-size:20px;
  text-shadow:0 2px 3px #000
}

.pill{
  background:#254764dd;
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
  border:1px solid #ffffff22
}

.pill.online{
  background:#167a6dcc
}

.player{
  position:absolute;
  width:78px;
  height:96px;
  transform:translate(-50%,-80%);
  transition:left .08s,top .08s;
  cursor:pointer;
  z-index:20;
  text-align:center;
  filter:drop-shadow(0 4px 3px #0005)
}

.playerImg{
  width:68px;
  height:68px;
  object-fit:contain;
  display:block;
  margin:0 auto
}

.name{
  margin-top:2px;
  text-align:center;
  background:#27333bd9;
  border:1px solid #ffffff33;
  border-radius:10px;
  padding:3px 6px;
  font-size:11px;
  white-space:nowrap;
  text-shadow:0 1px 1px #000
}

.me .name{
  background:#5a4721e8;
  box-shadow:0 0 0 1px #ffd35c66
}

#hint{
  position:absolute;
  left:18px;
  bottom:18px;
  background:#15232ee8;
  border:1px solid #ffffff22;
  padding:10px 14px;
  border-radius:12px;
  font-size:12px;
  z-index:30;
  box-shadow:0 5px 18px #0025
}

#chat{
  position:absolute;
  right:18px;
  bottom:18px;
  width:min(350px,34vw);
  background:#15232eea;
  border:1px solid #ffffff35;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 12px 35px #0028;
  z-index:30;
  backdrop-filter:blur(5px)
}

#chatTitle{
  padding:9px 12px;
  background:#0b1b28aa;
  font-weight:bold;
  font-size:13px;
  border-bottom:1px solid #ffffff18
}

#messages{
  height:205px;
  overflow:auto;
  padding:10px 12px;
  font-size:13px
}

.msg{
  margin:7px 0;
  line-height:1.4
}

.msg b{
  color:#ffd66b
}

#send{
  display:flex;
  border-top:1px solid #ffffff25
}

#input{
  flex:1;
  background:#0b1620;
  border:0;
  color:#fff;
  padding:13px;
  outline:0
}

#btn{
  border:0;
  background:#3888ed;
  color:#fff;
  padding:0 18px;
  font-size:14px;
  cursor:pointer
}

#modal{
  position:absolute;
  inset:0;
  background:#04233566;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:50;
  backdrop-filter:blur(3px)
}

.box{
  background:linear-gradient(145deg,#16394dcc,#102737ee);
  padding:28px;
  width:min(390px,92%);
  text-align:center;
  border:1px solid #ffffff33;
  border-radius:20px;
  box-shadow:0 20px 60px #001a
}

.box h2{
  margin:0 0 8px;
  font-size:26px
}

.box p{
  color:#d8edf2;
  line-height:1.6;
  margin-bottom:15px
}

.genderTitle{
  font-size:13px;
  color:#cfe8ee;
  margin-bottom:9px
}

.genderRow{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-bottom:15px
}

.genderOption{
  width:145px;
  padding:10px 8px;
  border:2px solid #ffffff22;
  border-radius:15px;
  background:#071923aa;
  cursor:pointer;
  transition:.15s
}

.genderOption:hover{
  transform:translateY(-2px);
  border-color:#ffffff55
}

.genderOption.selected{
  border-color:#42d6ff;
  background:#0d4660cc;
  box-shadow:0 0 18px #42d6ff44
}

.genderOption img{
  width:82px;
  height:82px;
  object-fit:contain;
  display:block;
  margin:auto
}

.genderOption div{
  margin-top:5px;
  font-weight:bold;
  font-size:13px
}

.box input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #ffffff25;
  margin:7px 0;
  background:#071923;
  color:white;
  outline:0;
  display:block
}

.box input:focus{
  border-color:#159fd0
}

.box button{
  padding:12px 25px;
  border:0;
  border-radius:10px;
  background:#159fd0;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  margin-top:7px
}

.box button:disabled{
  opacity:.5;
  cursor:not-allowed
}

#error{
  min-height:20px;
  margin:4px 0 0;
  color:#ff8f8f;
  font-size:12px
}

@media(max-width:700px){

  #chat{
    width:calc(100vw - 28px);
    right:14px;
    bottom:85px;
    transition:bottom .2s ease;
  }

  #messages{
    height:140px;
  }

  #hint{
    left:10px;
    bottom:245px;
    font-size:11px;
  }

  .genderOption{
    width:42vw;
    max-width:145px;
  }

  #input{
    font-size:16px;
    min-height:48px;
  }

  #btn{
    min-width:68px;
  }

}
  #top{
    left:10px;
    top:10px
  }

  #top b{
    font-size:16px
  }

  .pill{
    padding:6px 9px;
    font-size:12px
  }

  #chat{
    width:calc(100vw - 28px);
    right:14px;
    bottom:14px
  }

  #messages{
    height:140px
  }

  #hint{
    left:10px;
    bottom:175px;
    font-size:11px
  }

  .genderOption{
    width:42vw;
    max-width:145px
  }
}
</style>
</head>

<body>

<div id="world">

<div id="map"></div>

<div id="top">
<b>🌴 shako的平行空间</b>
<span class="pill online" id="count">在线：0/10</span>
<span class="pill">十人房</span>
</div>

<div id="hint">
WASD / 方向键移动　·　最多十个人打开同一个网址即可见面
</div>

<div id="chat">

<div id="chatTitle">
💬 shako的平行空间 · 聊天室
</div>

<div id="messages"></div>

<div id="send">
<input id="input" maxlength="200" placeholder="说点什么…">
<button id="btn">发送</button>
</div>

</div>

<div id="modal">

<div class="box">

<h2>🌴 shako的平行空间</h2>

<p>
欢迎来到海滩大厅<br>
先选择你的角色，再输入昵称和房间密码
</p>

<div class="genderTitle">
选择你的角色
</div>

<div class="genderRow">

<div class="genderOption selected" id="maleOption" data-gender="male">

<img src="./male.png" alt="男生">

<div>👨 男生</div>

</div>

<div class="genderOption" id="femaleOption" data-gender="female">

<img src="./female.png" alt="女生">

<div>👩 女生</div>

</div>

</div>

<input
id="nick"
maxlength="12"
autocomplete="nickname"
placeholder="请输入昵称"
>

<input
id="password"
type="password"
maxlength="100"
autocomplete="off"
placeholder="请输入房间密码"
>

<div id="error"></div>

<button id="join" type="button">
进入海滩
</button>

</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
"use strict";

let socket=null;

try{
  if(typeof io==="function")socket=io();
}catch(e){
  socket=null;
}

let myId=null;
let selectedGender="male";
let me={x:50,y:55};

const speed=1.2;

const modal=document.getElementById("modal");
const nick=document.getElementById("nick");
const password=document.getElementById("password");
const joinBtn=document.getElementById("join");
const errorBox=document.getElementById("error");
const world=document.getElementById("world");
const messages=document.getElementById("messages");
const input=document.getElementById("input");
const count=document.getElementById("count");

const maleOption=document.getElementById("maleOption");
const femaleOption=document.getElementById("femaleOption");

function esc(s){

return String(s).replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);

}

function msg(name,text){

const d=document.createElement("div");

d.className="msg";

d.innerHTML=
"<b>"+esc(name)+"：</b>"+esc(text);

messages.appendChild(d);

messages.scrollTop=messages.scrollHeight;

}

function setError(text){

errorBox.textContent=text||"";

}

function chooseGender(gender){

selectedGender=gender;

maleOption.classList.toggle(
  "selected",
  gender==="male"
);

femaleOption.classList.toggle(
  "selected",
  gender==="female"
);

}

maleOption.addEventListener(
  "click",
  ()=>chooseGender("male")
);

femaleOption.addEventListener(
  "click",
  ()=>chooseGender("female")
);

function startAuth(){

setError("");

const n=nick.value.trim()||"玩家";
const p=password.value;

if(!p){

setError("请输入房间密码");

password.focus();

return;

}

if(!socket){

setError(
  "服务器连接失败，请刷新页面后重试"
);

return;

}

joinBtn.disabled=true;

joinBtn.textContent="验证中...";

socket.emit("auth",p);

}

joinBtn.addEventListener(
  "click",
  startAuth
);

nick.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter"){

      e.preventDefault();

      password.focus();

    }

  }
);

password.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter"){

      e.preventDefault();

      startAuth();

    }

  }
);

input.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter")send();

  }
);

document.getElementById("btn")
.addEventListener(
  "click",
  send
);

function send(){

const text=input.value.trim();

if(!text)return;

if(socket)socket.emit("chat",text);

input.value="";

}

if(socket){

socket.on(
  "connect",
  ()=>setError("")
);

socket.on(
  "connect_error",
  ()=>{

    joinBtn.disabled=false;

    joinBtn.textContent="进入海滩";

    setError(
      "无法连接服务器，请稍后刷新重试"
    );

  }
);

socket.on(
  "authError",
  ()=>{

    joinBtn.disabled=false;

    joinBtn.textContent="进入海滩";

    password.value="";

    setError(
      "房间密码错误，请重新输入"
    );

    password.focus();

  }
);

socket.on(
  "full",
  ()=>{

    joinBtn.disabled=true;

    joinBtn.textContent="房间已满";

    setError(
      "房间已经满员，目前最多10人"
    );

  }
);

socket.on(
  "init",
  d=>{

    myId=d.you.id;

    me=d.you;

    modal.style.display="none";

    const n=
      nick.value.trim()||"玩家";

    msg(
      "系统",
      "🏝️ 欢迎 "+n+
      " 来到 shako 的平行空间！"
    );

    socket.emit(
      "setName",
      n
    );

    /*
      密码验证成功后，
      把性别告诉服务器
    */

    socket.emit(
      "setGender",
      selectedGender
    );

  }
);

socket.on(
  "chat",
  d=>msg(d.name,d.text)
);

socket.on(
  "players",
  ps=>{

    count.textContent=
      "在线："+ps.length+"/10";

    document
      .querySelectorAll(".player")
      .forEach(e=>e.remove());

    ps.forEach(p=>{

      const el=
        document.createElement("div");

      el.className=
        "player"+
        (p.id===myId?" me":"");

      el.style.left=p.x+"%";

      el.style.top=p.y+"%";

      const gender=
        p.gender==="female"
        ?"female"
        :"male";

      const img=
        gender==="female"
        ?"female.png"
        :"male.png";

      el.innerHTML=
        '<img class="playerImg" '+
        'src="./'+img+'" alt="">'+
        '<div class="name">'+
        esc(p.name)+
        (p.id===myId?"（你）":"")+
        "</div>";

      world.appendChild(el);

    });

  }
);

}

document.addEventListener(
  "keydown",
  e=>{

    /*
      输入昵称、密码、聊天时，
      WASD 不执行移动
    */

    if(
      document.activeElement===input||
      document.activeElement===nick||
      document.activeElement===password
    )return;

    let dx=0;
    let dy=0;

    if(
      ["ArrowUp","w","W"].includes(e.key)
    )dy=-speed;

    if(
      ["ArrowDown","s","S"].includes(e.key)
    )dy=speed;

    if(
      ["ArrowLeft","a","A"].includes(e.key)
    )dx=-speed;

    if(
      ["ArrowRight","d","D"].includes(e.key)
    )dx=speed;

    if(dx||dy){

      e.preventDefault();

      me.x=
        Math.max(
          5,
          Math.min(
            95,
            me.x+dx
          )
        );

      me.y=
        Math.max(
          8,
          Math.min(
            92,
            me.y+dy
          )
        );

      if(socket){

        socket.emit(
          "move",
          {
            x:me.x,
            y:me.y
          }
        );

      }

    }

  }
);

</script>
<script>

(function(){

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");

  if(!chat || !input) return;

  const isMobile =
    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    );

  if(!isMobile) return;

  const normalBottom = 85;

  function adjustChat(){

    const viewport = window.visualViewport;

    if(!viewport) return;

    const keyboardHeight =
      window.innerHeight - viewport.height;

    if(keyboardHeight > 120){

      chat.style.bottom =
        (keyboardHeight + 15) + "px";

    }else{

      chat.style.bottom =
        normalBottom + "px";

    }
  }

  if(window.visualViewport){

    window.visualViewport.addEventListener(
      "resize",
      adjustChat
    );

    window.visualViewport.addEventListener(
      "scroll",
      adjustChat
    );

  }

  input.addEventListener(
    "focus",
    function(){

      setTimeout(adjustChat,100);
      setTimeout(adjustChat,400);

    }
  );

  input.addEventListener(
    "blur",
    function(){

      setTimeout(adjustChat,200);

    }
  );

  window.addEventListener(
    "resize",
    adjustChat
  );

})();

</script>

</body>
</html>
