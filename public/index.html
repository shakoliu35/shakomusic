<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shako的平行空间</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Microsoft YaHei",sans-serif;
  background:#000;
  color:#fff;
}

#world{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* 海滩背景图 */
#map{
  position:absolute;
  inset:0;
  background-image:url('./beach-bg.png');
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
}

/* 顶部 */
#top{
  position:absolute;
  left:18px;
  top:18px;
  display:flex;
  align-items:center;
  gap:10px;
  z-index:30;
}

#top b{
  font-size:20px;
  text-shadow:0 2px 3px #000;
}

.pill{
  background:#254764dd;
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
  border:1px solid #ffffff22;
}

.pill.online{
  background:#167a6dcc;
}

/* 玩家 */
.player{
  position:absolute;
  width:68px;
  height:74px;
  transform:translate(-50%,-72%);
  transition:left .08s,top .08s;
  cursor:pointer;
  z-index:20;
  filter:drop-shadow(0 4px 3px #0005);
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  margin:auto;
  border:3px solid #fff;
  background:#ffd2a8;
  position:relative;
  box-shadow:0 2px 5px #0004;
}

.avatar:before{
  content:"";
  position:absolute;
  width:16px;
  height:7px;
  border-radius:50%;
  background:#8b5a3c;
  left:9px;
  top:-5px;
}

.avatar:after{
  content:"";
  position:absolute;
  width:46px;
  height:11px;
  left:-6px;
  top:28px;
  background:#347bc7;
  border-radius:12px;
}

.name{
  margin-top:2px;
  text-align:center;
  background:#27333bd9;
  border:1px solid #ffffff33;
  border-radius:10px;
  padding:3px 6px;
  font-size:11px;
  white-space:nowrap;
  text-shadow:0 1px 1px #000;
}

.me .avatar{
  box-shadow:0 0 0 3px #ffd35c,0 4px 10px #0005;
}

.me .name{
  background:#5a4721e8;
}

/* 左下提示 */
#hint{
  position:absolute;
  left:18px;
  bottom:18px;
  background:#15232ee8;
  border:1px solid #ffffff22;
  padding:10px 14px;
  border-radius:12px;
  font-size:12px;
  z-index:30;
  box-shadow:0 5px 18px #0025;
}

/* 聊天 */
#chat{
  position:absolute;
  right:18px;
  bottom:18px;
  width:min(350px,34vw);
  background:#15232eea;
  border:1px solid #ffffff35;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 12px 35px #0028;
  z-index:30;
  backdrop-filter:blur(5px);
}

#chatTitle{
  padding:9px 12px;
  background:#0b1b28aa;
  font-weight:bold;
  font-size:13px;
  border-bottom:1px solid #ffffff18;
}

#messages{
  height:205px;
  overflow:auto;
  padding:10px 12px;
  font-size:13px;
}

.msg{
  margin:7px 0;
  line-height:1.4;
}

.msg b{
  color:#ffd66b;
}

#send{
  display:flex;
  border-top:1px solid #ffffff25;
}

#input{
  flex:1;
  background:#0b1620;
  border:0;
  color:#fff;
  padding:13px;
  outline:0;
}

#btn{
  border:0;
  background:#3888ed;
  color:#fff;
  padding:0 18px;
  font-size:14px;
  cursor:pointer;
}

#btn:hover{
  background:#4a9aff;
}

/* 登录弹窗 */
#modal{
  position:absolute;
  inset:0;
  background:#04233566;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:50;
  backdrop-filter:blur(3px);
}

.box{
  background:linear-gradient(145deg,#16394dcc,#102737ee);
  padding:28px;
  border-radius:20px;
  width:min(370px,90%);
  text-align:center;
  border:1px solid #ffffff33;
  box-shadow:0 20px 60px #001a;
}

.box h2{
  margin:0 0 8px;
  font-size:26px;
}

.box p{
  color:#d8edf2;
}

.box input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #ffffff25;
  margin:12px 0;
  background:#071923;
  color:white;
  outline:0;
}

.box button{
  padding:12px 25px;
  border:0;
  border-radius:10px;
  background:#159fd0;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.box button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

@media(max-width:700px){

  #top{
    left:10px;
    top:10px;
  }

  #top b{
    font-size:16px;
  }

  .pill{
    padding:6px 9px;
    font-size:12px;
  }

  #chat{
    width:calc(100vw - 28px);
    right:14px;
    bottom:14px;
  }

  #messages{
    height:140px;
  }

  #hint{
    left:10px;
    bottom:175px;
    font-size:11px;
  }
}
</style>
</head>

<body>

<div id="world">

  <!-- 唯一背景 -->
  <div id="map"></div>

  <!-- 顶部信息 -->
  <div id="top">
    <b>🌴 shako的平行空间</b>
    <span class="pill online" id="count">在线：0/10</span>
    <span class="pill">十人房</span>
  </div>

  <!-- 移动提示 -->
  <div id="hint">
    WASD / 方向键移动　·　最多十个人打开同一个网址即可见面
  </div>

  <!-- 聊天 -->
  <div id="chat">

    <div id="chatTitle">
      💬 shako的平行空间 · 聊天室
    </div>

    <div id="messages"></div>

    <div id="send">
      <input
        id="input"
        maxlength="200"
        placeholder="说点什么…"
      >
      <button id="btn">发送</button>
    </div>

  </div>

  <!-- 进入游戏 -->
  <div id="modal">

    <div class="box">

      <h2>🌴 shako的平行空间</h2>

      <p>
        欢迎来到海滩大厅<br>
        给自己取一个昵称
      </p>

     <input
  id="nick"
  maxlength="12"
  placeholder="例如：小明"
>

<input
  id="password"
  type="password"
  placeholder="请输入房间密码"
>

<button id="join">
  进入海滩
</button>

    </div>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

let socket = null;

try{
  if(typeof io === "function"){
    socket = io();
  }
}catch(e){}

let myId = null;

let me = {
  x:50,
  y:55
};

const speed = 1.2;

const modal =
  document.getElementById("modal");

const nick =
  document.getElementById("nick");
const password =
  document.getElementById("password");
const world =
  document.getElementById("world");

const messages =
  document.getElementById("messages");

const input =
  document.getElementById("input");

const count =
  document.getElementById("count");


function esc(s){

  return String(s).replace(
    /[&<>"']/g,

    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])

  );

}


function msg(name,text){

  const d =
    document.createElement("div");

  d.className = "msg";

  d.innerHTML =
    "<b>"
    + esc(name)
    + "：</b>"
    + esc(text);

  messages.appendChild(d);

  messages.scrollTop =
    messages.scrollHeight;

}


document.getElementById("join").onclick = () => {

  const n =
    nick.value.trim() || "玩家";

  const p =
    password.value.trim();

  if(!p){
    password.focus();
    return;
  }

  if(!socket){
    alert("服务器连接失败，请刷新页面后重试。");
    return;
  }

  const joinBtn =
    document.getElementById("join");

  joinBtn.disabled = true;
  joinBtn.textContent = "验证中...";

  socket.emit("auth",p);

};


nick.addEventListener("keydown",e => {

  if(e.key === "Enter"){
    document
      .getElementById("join")
      .click();
  }

});


document.getElementById("btn").onclick =
  send;


input.addEventListener("keydown",e => {

  if(e.key === "Enter"){
    send();
  }

});


function send(){

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  if(socket){

    socket.emit("chat",text);

  }else{

    msg("我",text);

  }

  input.value = "";

}


if(socket){
socket.on("authError",() => {

    const joinBtn =
      document.getElementById("join");

    joinBtn.disabled = false;
    joinBtn.textContent = "进入海滩";

    password.value = "";
    password.placeholder = "密码错误，请重新输入";
    password.focus();

  });
  socket.on("init",d => {

    myId = d.you.id;

    me = d.you;

  });


  socket.on("full",() => {

    modal
      .querySelector("p")
      .textContent =
      "房间已经满员，目前最多 10 人。";

    document
      .getElementById("join")
      .disabled = true;

    modal.style.display = "flex";

  });


  socket.on("chat",d => {

    msg(d.name,d.text);

  });


  socket.on("players",ps => {

    count.textContent =
      "在线：" + ps.length + "/10";

    document
      .querySelectorAll(".player")
      .forEach(e => e.remove());


    ps.forEach(p => {

      const el =
        document.createElement("div");

      el.className =
        "player"
        + (p.id === myId ? " me" : "");

      el.style.left =
        p.x + "%";

      el.style.top =
        p.y + "%";


      el.innerHTML =

        '<div class="avatar" style="background:'
        + (
          p.id === myId
          ? "#ffd2a8"
          : "#f4b6d2"
        )
        + '"></div>'

        +

        '<div class="name">'
        + esc(p.name)
        + (
          p.id === myId
          ? "（你）"
          : ""
        )
        + "</div>";


      world.appendChild(el);

    });

  });

}


document.addEventListener("keydown",e => {

  if(
    document.activeElement === input ||
    document.activeElement === nick
  ){
    return;
  }

  let dx = 0;
  let dy = 0;


  if(
    ["ArrowUp","w","W"].includes(e.key)
  ){
    dy = -speed;
  }


  if(
    ["ArrowDown","s","S"].includes(e.key)
  ){
    dy = speed;
  }


  if(
    ["ArrowLeft","a","A"].includes(e.key)
  ){
    dx = -speed;
  }


  if(
    ["ArrowRight","d","D"].includes(e.key)
  ){
    dx = speed;
  }


  if(dx || dy){

    e.preventDefault();

    me.x =
      Math.max(
        5,
        Math.min(
          95,
          me.x + dx
        )
      );

    me.y =
      Math.max(
        8,
        Math.min(
          92,
          me.y + dy
        )
      );


    if(socket){

      socket.emit(
        "move",
        {
          x:me.x,
          y:me.y
        }
      );

    }

  }

});

</script>

</body>
</html>
