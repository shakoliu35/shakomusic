<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>shako的平行空间</title>


<style>

*{
  box-sizing:border-box
}


html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  font-family:
    Arial,
    "Microsoft YaHei",
    sans-serif;

  background:#000;

  color:#fff

}


#world{

  position:relative;

  width:100%;
  height:100vh;

  overflow:hidden

}


#map{

  position:absolute;

  inset:0;

  background-image:var(--room-bg, url("beach-sunset.jpg"));

  background-size:cover;

  background-position:center;

  background-repeat:no-repeat

}


/* =========================
   顶部
   ========================= */

#top{

  position:absolute;

  left:18px;
  top:18px;

  display:flex;

  align-items:center;

  gap:10px;

  z-index:30

}


#top b{

  font-size:20px;

  text-shadow:
    0 2px 3px #000

}


.pill{

  background:#254764dd;

  padding:7px 12px;

  border-radius:20px;

  font-size:13px;

  border:
    1px solid #ffffff22

}


.pill.online{

  background:#167a6dcc

}


/* =========================
   人物
   ========================= */

.player{

  position:absolute;

  width:78px;
  height:96px;

  transform:
    translate(-50%,-80%);

  transition:
    left .08s,
    top .08s;

  cursor:pointer;

  z-index:20;

  text-align:center;

  filter:
    drop-shadow(
      0 4px 3px #0005
    )

}


.playerImg{

  width:68px;
  height:68px;

  object-fit:contain;

  display:block;

  margin:0 auto;

  cursor:pointer;

  -webkit-user-select:none;
  user-select:none;

  -webkit-tap-highlight-color:
    transparent

}


.name{

  margin-top:2px;

  text-align:center;

  background:#27333bd9;

  border:
    1px solid #ffffff33;

  border-radius:10px;

  padding:3px 6px;

  font-size:11px;

  white-space:nowrap;

  text-shadow:
    0 1px 1px #000

}


.me .name{

  background:#5a4721e8;

  box-shadow:
    0 0 0 1px #ffd35c66

}


/* =========================
   头顶聊天文字
   ========================= */

.speech{
  position:absolute;

  bottom:101px;

  left:50%;

  transform:
    translateX(-50%)
    translateY(-4px);

  background:transparent;

  color:#fff;

  padding:0;

  border:0;

  border-radius:0;

  font-size:15px;

  line-height:1.2;

  white-space:nowrap;

  max-width:none;

  overflow:visible;

  text-overflow:clip;

  z-index:60;

  pointer-events:none;

  text-shadow:
    0 2px 3px rgba(0,0,0,.75);

  animation:speechPop .18s ease-out;
}


@keyframes speechIn{

  from{

    opacity:0;

    transform:
      translateX(-50%)
      translateY(6px)

  }

  to{

    opacity:1;

    transform:
      translateX(-50%)
      translateY(0)

  }

}


/* =========================
   头顶互动表情
   ========================= */

.reaction{

  position:absolute;

  bottom:92px;

  left:50%;

  transform:
    translateX(-50%)
    translateY(-22px);

  font-size:20px;

  line-height:1;

  z-index:65;

  pointer-events:none;

  filter:
    drop-shadow(
      0 2px 3px
      rgba(0,0,0,.55)
    );

  animation:
    reactionPop .25s ease-out

}


@keyframes reactionPop{

  0%{

    opacity:0;

    transform:
      translateX(-50%)
      translateY(-10px)
      scale(.5)

  }

  60%{

    transform:
      translateX(-50%)
      translateY(-28px)
      scale(1.06)

  }

  100%{

    opacity:1;

    transform:
      translateX(-50%)
      translateY(-22px)
      scale(1)

  }

}


/* =========================
   人物表情选择菜单
   点击人物头像才出现
   ========================= */

.reactionMenu{

  position:absolute;

  left:50%;

  bottom:78px;

  transform:
    translateX(-50%);

  display:flex;

  gap:6px;

  padding:8px 9px;

  background:#132330ee;

  border:
    1px solid #ffffff2c;

  border-radius:14px;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.45);

  backdrop-filter:
    blur(8px);

  z-index:100;

  white-space:nowrap;

  animation:
    menuIn .15s ease-out

}


@keyframes menuIn{

  from{

    opacity:0;

    transform:
      translateX(-50%)
      translateY(6px)
      scale(.95)

  }

  to{

    opacity:1;

    transform:
      translateX(-50%)
      translateY(0)
      scale(1)

  }

}


/* =========================
   这里是本次唯一主要修改
   表情按钮放大
   ========================= */

.reactionBtn{
  width:34px;
  height:34px;

  border:0;

  border-radius:9px;

  background:#ffffff0d;

  font-size:19px;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:
    transform .12s,
    background .12s
}
  touch-action:manipulation;

  -webkit-tap-highlight-color:
    transparent

}


.reactionBtn:hover{

  transform:
    scale(1.12);

  background:#ffffff1c

}


.reactionBtn:active{

  transform:
    scale(.92)

}


/* =========================
   提示
   ========================= */

#hint{

  position:absolute;

  left:18px;

  bottom:18px;

  background:#15232ee8;

  border:
    1px solid #ffffff22;

  padding:10px 14px;

  border-radius:12px;

  font-size:12px;

  z-index:30;

  box-shadow:
    0 5px 18px #0025

}


/* =========================
   聊天室
   ========================= */

#chat{

  position:absolute;

  right:18px;

  bottom:18px;

  width:
    min(350px,34vw);

  background:#15232eea;

  border:
    1px solid #ffffff35;

  border-radius:16px;

  overflow:hidden;

  box-shadow:
    0 12px 35px #0028;

  z-index:30;

  backdrop-filter:
    blur(5px)

}


#chatTitle{

  padding:9px 12px;

  background:#0b1b28aa;

  font-weight:bold;

  font-size:13px;

  border-bottom:
    1px solid #ffffff18;

  cursor:move;

  user-select:none

}


#messages{

  height:210px;

  overflow:auto;

  padding:12px;

  font-size:13px

}


.msg{

  margin:7px 0;

  line-height:1.4

}


.msg b{

  color:#ffd66b

}


#send{

  display:flex;

  border-top:
    1px solid #ffffff25

}


#input{

  flex:1;

  min-width:0;

  background:#0b1620;

  border:0;

  color:#fff;

  padding:13px;

  outline:0;

  -webkit-appearance:none;

  appearance:none;

  border-radius:0;

  touch-action:manipulation

}


#input:focus{

  outline:none;

  box-shadow:none

}


#btn{

  border:0;

  background:#3888ed;

  color:#fff;

  padding:0 18px;

  font-size:14px;

  cursor:pointer;

  touch-action:manipulation

}


/* =========================
   登录窗口
   ========================= */

#modal{

  position:absolute;

  inset:0;

  background:#04233566;

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:50;

  backdrop-filter:
    blur(3px)

}


.box{

  background:
    linear-gradient(
      145deg,
      #16394dcc,
      #102737ee
    );

  padding:28px;

  width:
    min(390px,92%);

  text-align:center;

  border:
    1px solid #ffffff33;

  border-radius:20px;

  box-shadow:
    0 20px 60px #001a

}


.box h2{

  margin:0 0 8px;

  font-size:26px

}


.box p{

  color:#d8edf2;

  line-height:1.6;

  margin-bottom:15px

}


/* =========================
   房间选择
   ========================= */

.roomTitle{
  margin-top:4px;
  margin-bottom:8px;
  font-size:13px;
  font-weight:bold;
  text-align:left;
  color:#dcecf2
}

.roomGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px
}

.roomOption{
  border:1px solid #ffffff22;
  background:#102333cc;
  border-radius:12px;
  padding:10px 8px;
  cursor:pointer;
  text-align:left;
  transition:.15s ease;
  color:#fff;
  user-select:none;
}

.roomOption:hover{
  background:#18364dcc;
  transform:translateY(-1px)
}

.roomOption.selected{
  border-color:#ffd35caa;
  background:#5a4721aa;
  box-shadow:0 0 0 1px #ffd35c44
}

.roomOption .roomIcon{
  font-size:20px;
  margin-right:5px
}

.roomOption .roomName{
  font-weight:bold;
  font-size:13px
}

.roomOption .roomDesc{
  display:block;
  margin-top:3px;
  color:#a9cbd3;
  font-size:10px;
  line-height:1.3
}

#roomCurrent{
  margin-top:2px;
  margin-bottom:8px;
  color:#ffd35c;
  font-size:11px;
  text-align:left
}

@media(max-width:700px){
  .roomGrid{gap:7px}
  .roomOption{padding:9px 7px}
  .roomOption .roomDesc{font-size:9px}
}

.genderTitle{

  font-size:13px;

  color:#cfe8ee;

  margin-bottom:9px

}


.genderRow{

  display:flex;

  justify-content:center;

  gap:18px;

  margin-bottom:15px

}


.genderOption{

  width:145px;

  padding:10px 8px;

  border:
    2px solid #ffffff22;

  border-radius:15px;

  background:#071923aa;

  cursor:pointer;

  transition:.15s;

  touch-action:manipulation

}


.genderOption:hover{

  transform:
    translateY(-2px);

  border-color:
    #ffffff55

}


.genderOption.selected{

  border-color:#42d6ff;

  background:#0d4660cc;

  box-shadow:
    0 0 18px #42d6ff44

}


.genderOption img{

  width:82px;

  height:82px;

  object-fit:contain;

  display:block;

  margin:auto

}


.genderOption div{

  margin-top:5px;

  font-weight:bold;

  font-size:13px

}


.box input{

  width:100%;

  padding:13px;

  border-radius:10px;

  border:
    1px solid #ffffff25;

  margin:7px 0;

  background:#071923;

  color:white;

  outline:0;

  display:block;

  font-size:16px;

  -webkit-appearance:none;

  appearance:none

}


.box input:focus{

  border-color:#159fd0

}


.box button{

  padding:12px 25px;

  border:0;

  border-radius:10px;

  background:#159fd0;

  color:#fff;

  font-weight:bold;

  cursor:pointer;

  margin-top:7px;

  touch-action:manipulation

}


.box button:disabled{

  opacity:.5;

  cursor:not-allowed

}


#error{

  min-height:20px;

  margin:4px 0 0;

  color:#ff8f8f;

  font-size:12px

}


/* =========================
   房主控制面板
   ========================= */

#hostPanel{

  display:none;

  position:absolute;

  top:70px;

  right:18px;

  width:240px;

  max-height:70vh;

  overflow:auto;

  z-index:40;

  background:#102737ee;

  border:
    1px solid #ffd75c66;

  border-radius:14px;

  padding:14px;

  box-shadow:
    0 12px 35px #0007;

  backdrop-filter:
    blur(8px)

}


#hostPanel.show{

  display:block

}


.hostTitle{

  color:#ffd75c;

  font-weight:bold;

  font-size:15px;

  margin-bottom:10px

}


.hostSub{

  color:#bcd0d8;

  font-size:12px;

  margin-bottom:8px

}


.hostPlayer{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:7px;

  padding:7px;

  margin:5px 0;

  background:#ffffff0d;

  border-radius:8px;

  font-size:12px

}


.hostPlayerName{

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap

}


.hostKick{

  border:0;

  border-radius:6px;

  padding:4px 8px;

  background:#a83b3b;

  color:#fff;

  cursor:pointer;

  font-size:11px;

  flex:none;

  touch-action:manipulation

}


.hostAction{

  width:100%;

  margin-top:10px;

  padding:9px;

  border:0;

  border-radius:9px;

  color:#fff;

  cursor:pointer;

  font-weight:bold;

  touch-action:manipulation

}


#closeRoomBtn{

  background:#a83b3b

}


#openRoomBtn{

  display:none;

  background:#278c68

}


#roomStatus{

  margin-top:8px;

  color:#ffb0b0;

  font-size:11px;

  line-height:1.4

}


/* =========================
   手机端
   ========================= */

@media(max-width:700px){

  #top{

    left:10px;

    top:10px

  }


  #top b{

    font-size:16px

  }


  .pill{

    padding:6px 9px;

    font-size:12px

  }


  #chat{

    width:
      calc(100vw - 28px);

    right:14px;

    bottom:85px;

    transition:
      bottom .2s ease

  }


  #messages{

    height:140px

  }


  #hint{

    left:10px;

    bottom:175px;

    font-size:11px

  }


  .genderOption{

    width:42vw;

    max-width:145px

  }


  #input{

    font-size:16px;

    min-height:48px

  }


  #btn{

    min-width:68px

  }


  #hostPanel{

    top:58px;

    right:10px;

    width:220px;

    max-height:65vh

  }


  /*
    手机头顶文字
    保持原来的确定位置和大小
  */

 .speech{
  bottom:94px;
  font-size:17px;
  white-space:nowrap;
}

  /*
    手机头顶互动表情
    保持原来的位置
  */

  .reaction{

    font-size:22px;

    bottom:84px;

    transform:
      translateX(-50%)
      translateY(-25px)

  }


  /*
    手机点击头像后的表情菜单
    这次只把按钮放大
  */

  .reactionMenu{

    bottom:78px;

    padding:7px 8px;

    gap:4px

  }


.reactionBtn{
  width:30px;
  height:30px;
  font-size:17px
}

}


/* =========================
   超小屏
   ========================= */

@media(max-width:400px){

  .speech{

    font-size:16px

  }


  .reaction{

    font-size:21px

  }


  .reactionBtn{

    width:40px;

    height:40px;

    font-size:24px

  }

}

</style>

</head>

<div id="world">


<div id="map"></div>


<div id="top">

<b>
🌴 shako的平行空间

在线：0/10

let socket=null;


try{

    socket=io();

  }

}catch(e){

  socket=null;

}


let myId=null;

  },

  },

    bg:"private.png",
    desc:"小范围 · 私密聊天"
  }

let me={

  x:50,

  y:55

};


const speed=1.2;


const modal=
  document.getElementById(
    "modal"
  );


const nick=
  document.getElementById(
    "nick"
  );


const password=
  document.getElementById(
    "password"
  );


const hostPassword=
  document.getElementById(
    "hostPassword"
  );


const joinBtn=
  document.getElementById(
    "join"
  );


const errorBox=
  document.getElementById(
    "error"
  );


const world=
  document.getElementById(
    "world"
  );


const messages=
  document.getElementById(
    "messages"
  );


const input=
  document.getElementById(
    "input"
  );


const count=
  document.getElementById(
    "count"
  );


const maleOption=
  document.getElementById(
    "maleOption"
  );


const femaleOption=
  document.getElementById(
    "femaleOption"
  );


const closeRoomBtn=
  document.getElementById(
    "closeRoomBtn"
  );


const openRoomBtn=
  document.getElementById(
    "openRoomBtn"
  );


/* =========================
   互动表情
   ========================= */

const reactionList=[

  "❤️",
  "😂",
  "👍",
  "😮",
  "😡",
  "🎉"

];


let activeReactionMenu=null;


/* =========================
   工具
   ========================= */

function esc(s){

  return String(s).replace(

    /[&<>"']/g,

    c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[c])

  );

}


/* =========================
   聊天消息
   ========================= */

function msg(name,text){

  const d=
    document.createElement(
      "div"
    );

document.addEventListener(
  "keydown",
  e=>{

    if(

      document.activeElement===
      input

      ||

      document.activeElement===
      nick

      ||

      document.activeElement===
      password

      ||

      document.activeElement===
      hostPassword

    ){

      return;

    }


    let dx=0;

    let dy=0;


    if(
      [
        "ArrowUp",
        "w",
        "W"
      ].includes(e.key)
    ){

      dy=-speed;

    }


    if(
      [
        "ArrowDown",
        "s",
        "S"
      ].includes(e.key)
    ){

      dy=speed;

    }


    if(
      [
        "ArrowLeft",
        "a",
        "A"
      ].includes(e.key)
    ){

      dx=-speed;

    }


    if(
      [
        "ArrowRight",
        "d",
        "D"
      ].includes(e.key)
    ){

      dx=speed;

    }


    if(dx||dy){

      e.preventDefault();


      me.x=
        Math.max(
          5,
          Math.min(
            95,
            me.x+dx
          )
        );


      me.y=
        Math.max(
          8,
          Math.min(
            92,
            me.y+dy
          )
        );


      if(socket){

        socket.emit(
          "move",
          {
            x:me.x,
            y:me.y
          }
        );

      }

    }

  }
);

<script>

/* =========================
   手机端输入框适配
   ========================= */

(function(){

  const chat=
    document.getElementById(
      "chat"
    );


  const input=
    document.getElementById(
      "input"
    );


  if(
    !chat ||
    !input
  ){

    return;

  }


  const isMobile=
    /Android|iPhone|iPad|iPod/i
    .test(
      navigator.userAgent
    );


  if(!isMobile)return;


  const normalBottom=85;


  function adjustChat(){

    const viewport=
      window.visualViewport;


    if(!viewport)return;


    const keyboardHeight=
      window.innerHeight-
      viewport.height;


    if(
      keyboardHeight>120
    ){

      chat.style.bottom=
        (
          keyboardHeight+15
        )+"px";

    }else{

      chat.style.bottom=
        normalBottom+"px";

    }

  }


  if(
    window.visualViewport
  ){

    window.visualViewport.addEventListener(
      "resize",
      adjustChat
    );


    window.visualViewport.addEventListener(
      "scroll",
      adjustChat
    );

  }


  input.addEventListener(
    "focus",
    function(){

      setTimeout(
        adjustChat,
        100
      );


      setTimeout(
        adjustChat,
        400
      );

    }
  );


  input.addEventListener(
    "blur",
    function(){

      setTimeout(
        adjustChat,
        200
      );

    }
  );


  window.addEventListener(
    "resize",
    adjustChat
  );

})();


/* =========================
   电脑端拖动聊天框
   ========================= */

const chat=
  document.getElementById(
    "chat"
  );


const chatTitle=
  document.getElementById(
    "chatTitle"
  );


let dragging=false;

let offsetX=0;

let offsetY=0;


chatTitle.addEventListener(
  "mousedown",
  function(e){

    if(
      window.innerWidth<=700
    ){

      return;

    }


    dragging=true;


    const rect=
      chat.getBoundingClientRect();


    offsetX=
      e.clientX-
      rect.left;


    offsetY=
      e.clientY-
      rect.top;


    chat.style.left=
      rect.left+"px";


    chat.style.top=
      rect.top+"px";


    chat.style.right=
      "auto";


    chat.style.bottom=
      "auto";


    e.preventDefault();

  }
);


document.addEventListener(
  "mousemove",
  function(e){

    if(!dragging)return;


    chat.style.left=
      (
        e.clientX-
        offsetX
      )+"px";


    chat.style.top=
      (
        e.clientY-
        offsetY
      )+"px";

  }
);


document.addEventListener(
  "mouseup",
  function(){

    dragging=false;

  }
);

</script>

<script>
(function(){
  const music=document.getElementById("bgMusic");
  const btn=document.getElementById("musicBtn");
  if(!music||!btn)return;
  let playing=false;
  function update(){btn.textContent=playing?"🔊":"🔇";}
  async function start(){try{await music.play();playing=true;update();}catch(e){playing=false;update();}}
  btn.addEventListener("click",async()=>{if(music.paused){await start();}else{music.pause();playing=false;update();}});
  start();
  document.addEventListener("click",()=>{if(music.paused)start();},{once:true});
})();
</script>

</body>

</html>
